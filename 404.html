<!doctype html>
<html lang="de">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden | Stars of the Galaxy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/sotg-vorschau/favicon.png" type="image/png">
<link rel="stylesheet" href="/sotg-vorschau/assets/css/main.css?v=20261108">
<style>
  .nf-wrap { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px 16px; }
  .nf-code { font-family: var(--font-display); font-size: clamp(3.4rem, 14vw, 7rem); color: var(--amber); letter-spacing: .08em; margin: 0; }
  .nf-wrap h1 { font-family: var(--font-display); font-size: clamp(1.2rem, 4.5vw, 1.8rem); margin: .4rem 0 1rem; }
  .nf-wrap p { color: var(--ink-dim); max-width: 46ch; margin: 0 auto 1.6rem; }
  .nf-actions { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="nf-wrap">
  <div>
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 id="nf-h">Diese Koordinaten führen ins Leere</h1>
    <p id="nf-p">Die gesuchte Seite existiert nicht (mehr). Kein Grund zur Panik: Der Hyperraumsprung zurück dauert nur einen Klick.</p>
    <div class="nf-actions">
      <a class="btn btn--primary" id="nf-home" href="/sotg-vorschau/">Zur Startseite</a>
      <a class="btn btn--ghost" id="nf-tickets" href="/sotg-vorschau/tickets/">Tickets ansehen</a>
    </div>
  </div>
</main>
<script>
/* Eine 404-Datei für alle Sprachen: Text nach Adresse (/en/…, /nl/…) */
(function () {
  var m = /^\/(en|nl)(\/|$)/.exec(location.pathname);
  if (!m) return;
  var t = {
    en: ['Page not found | Stars of the Galaxy', 'These coordinates lead into the void', 'The page you are looking for does not exist (any more). Don’t panic: the hyperspace jump back is just one click away.', 'Back to the home page', 'See tickets'],
    nl: ['Pagina niet gevonden | Stars of the Galaxy', 'Deze coördinaten leiden naar het niets', 'De pagina die je zoekt bestaat niet (meer). Geen paniek: de hyperspace-sprong terug is maar één klik.', 'Naar de homepage', 'Tickets bekijken']
  }[m[1]];
  document.documentElement.lang = m[1];
  document.title = t[0];
  document.getElementById('nf-h').textContent = t[1];
  document.getElementById('nf-p').textContent = t[2];
  var h = document.getElementById('nf-home'); h.textContent = t[3]; h.href = '/' + m[1] + '/';
  var k = document.getElementById('nf-tickets'); k.textContent = t[4]; k.href = '/' + m[1] + '/tickets/';
})();
</script>
<script>document.addEventListener("submit",function(e){var f=e.target;if(!f||f.tagName!=="FORM"||!f.hasAttribute("data-transmission"))return;e.preventDefault();e.stopImmediatePropagation();var o=f.parentNode.querySelector(".transmission");if(o)o.remove();var d=document.createElement("div");d.className="transmission";d.setAttribute("role","status");d.innerHTML="<strong>&gt;&gt; Vorschau_</strong>"+"Diese Anfrage wurde nicht verschickt. Auf der fertigen Seite landet sie direkt bei euch im Postfach.";f.parentNode.insertBefore(d,f);d.scrollIntoView({block:"center"});},true);</script>
</body>
</html>
